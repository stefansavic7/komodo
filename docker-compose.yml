# Komodo na serveru. Tajne su u .env (korijen projekta) i api/.env — vidi docs/SERVER.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: komodo
      POSTGRES_DB: komodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Upiši POSTGRES_PASSWORD u .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komodo -d komodo"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # dnevnici se brišu sami (vidi politiku privatnosti)

  api:
    build: .
    restart: unless-stopped
    env_file: api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      UPLOADS_DIR: /data/uploads
      DATABASE_URL: postgres://komodo:${POSTGRES_PASSWORD}@db:5432/komodo
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3002:3002"   # samo Nginx na istom serveru vidi API
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # dnevnici se brišu sami (vidi politiku privatnosti)

volumes:
  db-data:
  uploads:
