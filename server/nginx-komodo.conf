# /etc/nginx/sites-available/komodo — Komodo (API + web) iza Nginxa.
# HTTPS dodaje certbot (vidi docs/SERVER.md). DOMENA se zamjenjuje sed-om pri postavljanju.
# Ovaj fajl se uključuje u `http { }` blok glavnog /etc/nginx/nginx.conf; worker_connections i
# worker_rlimit_nofile se postavljaju tamo (docs/SERVER.md).

# --- Veza prema API-ju: stalne (keepalive) konekcije, da se ne otvara nova TCP veza po zahtjevu ---
upstream komodo_api {
    server 127.0.0.1:3002;
    keepalive 64;
}

# --- Keš statičkih fajlova (na disku servera); snimke Nginx služi direktno s diska (/media/) ---
# Zona od 50 MB drži ključeve (~400.000 fajlova); sami fajlovi su na disku, najviše 5 GB.
proxy_cache_path /var/cache/nginx/komodo levels=1:2 keys_zone=komodo_kes:50m max_size=5g inactive=1d use_temp_path=off;

# --- Ograničenje broja zahtjeva po IP adresi ---
# Mobilni operateri (m:tel, BH Telecom, HT Eronet) stavljaju mnogo korisnika iza iste javne IP adrese (CGNAT),
# pa granice moraju biti široke: Nginx ovdje zaustavlja samo očit napad s jedne adrese. Fina ograničenja
# (pokušaji prijave po nalogu, registracije, poruke) radi API u bazi.
# - /api/auth/: 10 zahtjeva/s, nalet do 30 odjednom. Prijava i registracija su rijetke (vrh poslije reklame
#   ~5/s za sve korisnike zajedno), a ovo usporava pogađanje lozinki i spam registracija.
# - /api/: 100 zahtjeva/s, nalet do 200. Korisnik u feedu pravi ~0,13 zahtjeva/s, pa je ovo dovoljno za
#   ~750 aktivnih korisnika iza jedne adrese operatera.
# Preko granice odgovor je 429 (aplikacija ga prikazuje kao grešku i korisnik pokuša ponovo).
limit_req_zone $binary_remote_addr zone=komodo_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=komodo_api:20m rate=100r/s;

# --- Dnevnik pristupa bez upita iz adrese (nalaz S-06) ---
# Link za potvrdu emaila (/api/auth/verify?token=…) i za novu lozinku (/?lozinka=…) nosi token u adresi, a
# upit drugih adresa (pretraga) je lični podatak koji za rad servera ne treba. Zato se bilježi samo putanja
# ($uri, bez „?…”). Referer se skraćuje isto: preglednik poslije otvaranja /?lozinka=… šalje tu adresu
# kao Referer za app.js i style.css (Referrer-Policy šalje punu adresu unutar istog sajta).
map $http_referer $komodo_referer_log {
    "~^(?<komodo_ref>[^?]*)\?"  "$komodo_ref?";
    default                     $http_referer;
}
# Vrijeme na početku reda (nadzor.sh broji 5xx u zadnjih 5 minuta po prva dva polja: vrijeme i status).
# rt = ukupno trajanje zahtjeva u Nginxu, urt = koliko je čekan API ("-" kad API nije pitan, npr. /media/).
log_format komodo '$time_iso8601 $status rt=$request_time urt=$upstream_response_time '
                  '$remote_addr "$request_method $uri $server_protocol" $body_bytes_sent '
                  '"$komodo_referer_log" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name DOMENA;

    # Sve osim objave videa: mali zahtjevi (JSON). Objava videa ima svoj blok ispod.
    client_max_body_size 1m;

    # Dnevnik u /var/log/nginx/ (Ubuntuov logrotate ga briše poslije 14 dana: /etc/logrotate.d/nginx).
    access_log /var/log/nginx/komodo.access.log komodo;
    error_log /var/log/nginx/komodo.error.log warn;

    limit_req_status 429;
    limit_req_log_level warn;

    # Kompresija tekstualnih odgovora (JSON feed je najveći dio prometa). text/html Nginx sažima uvijek;
    # .js ide i kao text/javascript (novije verzije biblioteke za MIME tipove), pa su navedena oba.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    # Bez verzije Nginxa u zaglavlju Server i na stranicama grešaka (S-16).
    server_tokens off;

    # Sigurnosna zaglavlja. Važe za sve odgovore jer nijedan location blok ispod nema svoj add_header
    # (Nginx tada ne bi naslijedio ove) — ne dodavati add_header u location blokove.
    # CSP: skripte i stilovi samo s našeg servera (index.html nema inline skripti); 'unsafe-inline' samo za
    # stilove, jer pravne stranice imaju <style> blok. Fontovi s Google Fonts. Snimci i sličice s našeg
    # servera (/media/), s Bunny CDN-a (*.b-cdn.net), blob: (pregled snimka prije objave) i data:.
    # HSTS (S-16): preglednik godinu dana ide samo na HTTPS. Preko čistog HTTP-a ga preglednici zanemaruju, pa ne
    # smeta prije certbota. `preload` tek kad sedmicu dana sve radi preko HTTPS-a (docs/SERVER.md, 2.7).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://*.b-cdn.net blob: data:; media-src 'self' https://*.b-cdn.net blob: data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Zajedničko za sve proxy blokove (nasljeđuje se u location blokove).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host (s portom) da API može porediti Origin s hostom i na nestandardnom portu (R-06).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Samo prava adresa klijenta; ono što klijent sam pošalje u X-Forwarded-For se pregazi (S-02: inače bi
    # lažnom adresom zaobišao ograničenja po IP-u u API-ju).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Objava videa (POST; GET na istu adresu je feed). Najviše 100 MB, spor upload s telefona:
    # dugi timeouti i bez baferovanja tijela, da snimak ide pravo u API.
    location = /api/listings {
        limit_req zone=komodo_api burst=200 nodelay;
        client_max_body_size 110m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://komodo_api;
    }

    location ^~ /api/auth/ {
        limit_req zone=komodo_auth burst=30 nodelay;
        proxy_pass http://komodo_api;
    }

    # API se nikad ne kešira (odgovori zavise od prijave).
    location ^~ /api/ {
        limit_req zone=komodo_api burst=200 nodelay;
        proxy_pass http://komodo_api;
    }

    # Snimci i sličice dok su na našem serveru (do ~30 min poslije obrade na Bunnyju) idu pravo s diska,
    # bez Node procesa: /srv/komodo/uploads je isti direktorij koji API vidi kao /data/uploads
    # (bind mount u docker-compose.yml). Obrisan fajl odmah daje 404 (nema keša u Nginxu); preglednik
    # smije čuvati snimak 10 minuta (privatnost, brisanje naloga). Range zahtjeve (206) Nginx radi sam.
    # Bez add_header ovdje: inače se ne bi naslijedila sigurnosna zaglavlja iz server bloka
    # (`expires` nije add_header i ne smeta).
    location ^~ /media/ {
        alias /srv/komodo/uploads/;
        autoindex off;
        # R-05: simbolički link u uploads/ se ne prati (inače bi Nginx poslužio fajl na koji pokazuje).
        disable_symlinks on;
        sendfile on;
        tcp_nopush on;
        expires 10m;
        # Samo tipovi koje API prima (VIDEO_EXT u api/src/server.js) i sličice; sve drugo kao preuzimanje.
        types {
            video/mp4        mp4;
            video/quicktime  mov;
            video/webm       webm;
            image/jpeg       jpg jpeg;
        }
        default_type application/octet-stream;
        # Skriveni i privremeni fajlovi se ne služe.
        location ~ /\. { return 404; }
    }

    # Universal Links (iOS) i App Links (Android): docs/PRODAVNICE.md, odjeljak 8. Fajlovi su u web/.well-known/,
    # a server/objava.sh ih kopira u /srv/komodo/well-known/. Uvijek application/json (AASA nema ekstenziju),
    # bez preusmjerenja i bez kolačića. Certbot za svoju provjeru dodaje tačnu putanju
    # (= /.well-known/acme-challenge/…), koja ima prednost nad ovim blokom.
    location ^~ /.well-known/ {
        alias /srv/komodo/well-known/;
        autoindex off;
        types { }
        default_type application/json;
        expires 1h;
    }

    # Minimalna verzija aplikacije (obavezna nadogradnja, docs/PRODAVNICE.md odjeljak 9): keš 5 minuta.
    location = /app-verzija.json {
        proxy_cache komodo_kes;
        proxy_cache_valid 200 5m;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        expires 5m;
        proxy_pass http://komodo_api;
    }

    # Statički fajlovi aplikacije. Cache-Control određuje API (api/src/rute/staticki.js, R-07) i Nginx ga poštuje:
    # /js/*.js i *.css s ?v=… → godinu dana, immutable; fontovi → 30 dana; ostalo max-age=0 (ne kešira se u
    # Nginxu, svaki zahtjev ide API-ju uz ETag). proxy_cache_valid 1h važi samo za odgovor bez ikakvog
    # Cache-Control zaglavlja. index.html i .html stranice se ne keširaju. Odgovori sa Set-Cookie se ne keširaju.
    # Ključ keša je cijela adresa s upitom ($request_uri), pa /app.js?v=A i /app.js?v=B nisu isti zapis.
    location ~* \.(js|css|png|svg|webmanifest|woff2?)$ {
        proxy_cache komodo_kes;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_pass http://komodo_api;
    }

    # Sličice za dijeljenje (Open Graph) /og/<id>.jpg: API šalje max-age=3600 (stvarna sličica) ili 60 s
    # (zajednička zamjenska), Nginx to poštuje; 200 bez zaglavlja 1 h. Ključ s upitom. R2-03: sličica obrisanog ili
    # ugašenog oglasa (API tada vraća 404, a 404 se ne kešira) nestaje iz Nginx keša najkasnije za 1 h; odmah na
    # zahtjev za uklanjanje sadržaja: docs/RUNBOOK.md, „Hitno uklanjanje sličice iz keša”.
    location ^~ /og/ {
        limit_req zone=komodo_api burst=200 nodelay;
        proxy_cache komodo_kes;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_pass http://komodo_api;
    }

    # Sve ostalo (index.html, pravne stranice, / s Open Graph oznakama za ?o= i ?b=): bez keša u Nginxu.
    # Ako se ovdje ikad uključi keš, ključ MORA sadržati upit ($request_uri), inače bi svi linkovi
    # /?o=… dobili isti pregled (docs/SPEC-V1.md, F-02).
    # R2-05: / je dinamična (OG oznake za ?o= i ?b= čitaju bazu, svaka nova vrijednost je promašaj keša), pa ima
    # istu široku granicu kao /api/ (100/s po IP-u, nalet 200; CGNAT — vidi limit_req_zone gore). Statički fajlovi
    # (.js, .css, slike) idu kroz blok iznad i ne troše ovu granicu.
    location / {
        limit_req zone=komodo_api burst=200 nodelay;
        proxy_pass http://komodo_api;
    }
}
