# /etc/nginx/sites-available/komodo — Komodo (API + web) iza Nginxa.
# HTTPS dodaje certbot (vidi docs/SERVER.md). DOMENA se zamjenjuje sed-om pri postavljanju.
# Ovaj fajl se uključuje u `http { }` blok glavnog /etc/nginx/nginx.conf; worker_connections i
# worker_rlimit_nofile se postavljaju tamo (docs/SERVER.md).

# --- Veza prema API-ju: stalne (keepalive) konekcije, da se ne otvara nova TCP veza po zahtjevu ---
upstream komodo_api {
    server 127.0.0.1:3002;
    keepalive 64;
}

# --- Keš statičkih fajlova i snimaka (na disku servera) ---
# Zona od 50 MB drži ključeve (~400.000 fajlova); sami fajlovi su na disku, najviše 5 GB.
proxy_cache_path /var/cache/nginx/komodo levels=1:2 keys_zone=komodo_kes:50m max_size=5g inactive=1d use_temp_path=off;

# --- Ograničenje broja zahtjeva po IP adresi ---
# Mobilni operateri (m:tel, BH Telecom, HT Eronet) stavljaju mnogo korisnika iza iste javne IP adrese (CGNAT),
# pa granice moraju biti široke: Nginx ovdje zaustavlja samo očit napad s jedne adrese. Fina ograničenja
# (pokušaji prijave po nalogu, registracije, poruke) radi API u bazi.
# - /api/auth/: 10 zahtjeva/s, nalet do 30 odjednom. Prijava i registracija su rijetke (vrh poslije reklame
#   ~5/s za sve korisnike zajedno), a ovo usporava pogađanje lozinki i spam registracija.
# - /api/: 100 zahtjeva/s, nalet do 200. Korisnik u feedu pravi ~0,13 zahtjeva/s, pa je ovo dovoljno za
#   ~750 aktivnih korisnika iza jedne adrese operatera.
# Preko granice odgovor je 429 (aplikacija ga prikazuje kao grešku i korisnik pokuša ponovo).
limit_req_zone $binary_remote_addr zone=komodo_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=komodo_api:20m rate=100r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMENA;

    # Sve osim objave videa: mali zahtjevi (JSON). Objava videa ima svoj blok ispod.
    client_max_body_size 1m;

    limit_req_status 429;
    limit_req_log_level warn;

    # Kompresija tekstualnih odgovora (JSON feed je najveći dio prometa). text/html Nginx sažima uvijek;
    # .js ide i kao text/javascript (novije verzije biblioteke za MIME tipove), pa su navedena oba.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    # Sigurnosna zaglavlja. Važe za sve odgovore jer nijedan location blok ispod nema svoj add_header
    # (Nginx tada ne bi naslijedio ove) — ne dodavati add_header u location blokove.
    # CSP: skripte i stilovi samo s našeg servera (index.html nema inline skripti); 'unsafe-inline' samo za
    # stilove, jer pravne stranice imaju <style> blok. Fontovi s Google Fonts. Snimci i sličice s našeg
    # servera (/media/), s Bunny CDN-a (*.b-cdn.net), blob: (pregled snimka prije objave) i data:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://*.b-cdn.net blob: data:; media-src 'self' https://*.b-cdn.net blob: data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Zajedničko za sve proxy blokove (nasljeđuje se u location blokove).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Objava videa (POST; GET na istu adresu je feed). Najviše 100 MB, spor upload s telefona:
    # dugi timeouti i bez baferovanja tijela, da snimak ide pravo u API.
    location = /api/listings {
        limit_req zone=komodo_api burst=200 nodelay;
        client_max_body_size 110m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://komodo_api;
    }

    location ^~ /api/auth/ {
        limit_req zone=komodo_auth burst=30 nodelay;
        proxy_pass http://komodo_api;
    }

    # API se nikad ne kešira (odgovori zavise od prijave).
    location ^~ /api/ {
        limit_req zone=komodo_api burst=200 nodelay;
        proxy_pass http://komodo_api;
    }

    # Snimci i sličice dok su na našem serveru (do ~30 min poslije obrade na Bunnyju): keš samo 10 min,
    # da snimak obrisanog oglasa ili naloga ne ostane dostupan iz keša (privatnost, brisanje naloga).
    location ^~ /media/ {
        proxy_cache komodo_kes;
        proxy_cache_valid 200 206 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_read_timeout 300s;
        proxy_pass http://komodo_api;
    }

    # Statički fajlovi aplikacije: keš 1 sat. index.html (bez keša) ih traži s oznakom verzije
    # (/app.js?v=…), pa nova verzija automatski dobija nove fajlove. index.html i .html stranice se ne keširaju.
    # API šalje "max-age=0", pa se to zaglavlje ovdje zanemaruje; odgovori s Set-Cookie se i dalje ne keširaju.
    location ~* \.(js|css|png|svg|webmanifest)$ {
        proxy_cache komodo_kes;
        proxy_cache_valid 200 1h;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_pass http://komodo_api;
    }

    # Sve ostalo (index.html, pravne stranice): bez keša.
    location / {
        proxy_pass http://komodo_api;
    }
}
