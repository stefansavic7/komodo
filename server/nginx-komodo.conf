# /etc/nginx/sites-available/komodo — Komodo (API + web) iza Nginxa.
# HTTPS dodaje certbot (vidi docs/SERVER.md). DOMENA se zamjenjuje sed-om pri postavljanju.
server {
    listen 80;
    listen [::]:80;
    server_name DOMENA;

    # Snimci idu kroz server prije Bunnyja: najviše 100 MB, sporiji upload s telefona.
    client_max_body_size 110m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
